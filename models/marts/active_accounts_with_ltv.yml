version: 2
models:
- name: active_accounts_with_ltv
  description: Joins orders with customer lifetime value, filtered to active accounts
  columns:
  - name: order_id
    description: Unique order identifier
    tests:
    - not_null
    - unique
  - name: order_date
    description: Date the order was placed
  - name: net_amount
    description: Order amount after discount
  - name: customer_id
    description: Unique customer identifier
    tests:
    - not_null
    - relationships:
        to: ref('dim_customers')
        field: customer_id
  - name: lifetime_value
    description: Customer lifetime value
