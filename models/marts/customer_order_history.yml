version: 2
models:
- name: customer_order_history
  description: Join customer details with their order history and flag any accounts
    with stale data
  columns:
  - name: customer_id
    description: Unique customer identifier
    tests:
    - not_null
    - unique
  - name: first_name
    description: Customer first name PII/Sensitive column - handle with care.
    meta:
      datahub_tags:
      - PII
  - name: last_name
    description: Customer last name PII/Sensitive column - handle with care.
    meta:
      datahub_tags:
      - PII
  - name: email_hash
    description: SHA-256 hashed email (PII-safe)
  - name: signup_date
    description: Account creation date
  - name: country
    description: Customer country code
  - name: is_active
    description: True if purchased in last 90 days
  - name: order_id
    description: Unique order identifier
    tests:
    - not_null
    - unique
  - name: order_date
    description: Date the order was placed
  - name: status
    description: Normalized order status
  - name: net_amount
    description: Order amount after discount
  - name: data_status
    description: Flag indicating if customer data is stale
